<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小狐狸的旋轉迷宮 · 遊戲小花園</title>
  <!-- 引入可愛的 Fredoka 與 Outfit 字型 -->
  <link rel="stylesheet" href="style.css">
<meta name="description" content="在 60 秒內幫小狐狸找到家。迷宮會慢慢旋轉，仔細看好路線再出發！">
<link rel="stylesheet" href="../shared/game.css">
</head>
<body class="game-page game-square" data-game="maze_adventure">
  <div class="game-container">
    <header class="game-header">
      <div class="title-row">
        <a href="../index.html" class="home-btn">🏠 返回</a>
        <h1>小狐狸的旋轉迷宮</h1>
      </div>
      <p class="subtitle">幫助小狐狸穿過複雜的森林迷宮，找到溫暖的家！</p>
      <div class="info-bar">
        <span class="timer-badge">⏱️ 剩餘時間: <span id="timerVal">60</span> 秒</span>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="560" height="560"></canvas>
    </div>

    <!-- Congrats overlay hidden by default -->
    <div id="congratsMsg" class="hidden">
      🎉 恭喜你找到家了！ 🎉<br>
      <button id="restartBtn">再玩一次</button>
    </div>

    <!-- Game Over overlay hidden by default -->
    <div id="gameOverMsg" class="hidden">
      😢 時間到了！ 😢<br>
      <span class="game-over-sub">小狐狸迷路了...</span>
      <button id="retryBtn">再試一次</button>
    </div>

    <footer class="game-footer">
      <div class="controls-guide">
        <span class="key-badge">▲</span>
        <span class="key-badge">▼</span>
        <span class="key-badge">◀</span>
        <span class="key-badge">▶</span>
        <span>鍵盤或滑動螢幕來移動</span>
      </div>
      <div class="rules-guide">
        <span class="rule-item">🦊 主角</span>
        <span class="rule-item">🏡 終點</span>
      </div>
    </footer>
  </div>

  <script src="../shared/catalog.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/shell.js"></script>
<script src="config.js"></script>
  <script src="game.js"></script>
</body>
</html>
