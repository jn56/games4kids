<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>地鼠出來玩 · 遊戲小花園</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #2e1065 0%, #4c1d95 100%);
            --panel-bg: rgba(255, 255, 255, 0.05);
            --border-glow: rgba(139, 92, 246, 0.3);
            --text-light: #f8fafc;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Fredoka', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-light);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: 1;
            pointer-events: none;
        }

        .game-container {
            position: relative;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 40px var(--border-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 440px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .back-btn {
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 1.8rem;
            background: linear-gradient(to right, #c084fc, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            background: #0f172a;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 70vh;
            aspect-ratio: 400/500;
        }

        .controls {
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
            color: #cbd5e1;
            text-align: center;
        }

        #muteBtn {
            background: rgba(139, 92, 246, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-family: var(--font-body);
            font-weight: 600;
        }
    </style>
<meta name="description" content="在時間內點中冒出頭的地鼠，累積更多分數！看清楚再出手，炸彈會扣分。">
<link rel="stylesheet" href="../shared/game.css">
</head>
<body class="game-page game-portrait" data-game="whack_a_mole">
    <div class="ambient-glow"></div>
    <div class="game-container">
        <div class="header">
            <a href="../index.html" class="back-btn">🏠 返回</a>
            <h1>地鼠出來玩</h1>
            <button id="muteBtn">🔊 音效: 開</button>
        </div>
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="500"></canvas>
        </div>
        <div class="controls">
            <span>點擊跑出來的地鼠！小心不要按到炸彈喔！</span>
        </div>
    </div>

    <script src="../shared/catalog.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/shell.js"></script>
<script src="config.js"></script>
    <script src="game.js"></script>
</body>
</html>
