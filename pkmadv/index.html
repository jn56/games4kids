<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👧 草原走道大冒險！ - 2.5D 歡樂跑酷</title>
  <!-- 引入可愛的 Fredoka 與 Outfit 字型，適合兒童遊戲與現代 UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <div class="title-row">
        <h1>👧 草原走道大冒險！</h1>
      </div>
      <p class="subtitle">避開木箱與樹木，在陽光草原上收集花朵！</p>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>

    <footer class="game-footer">
      <div class="controls-guide">
        <span class="key-badge">▲</span>
        <span class="key-badge">▼</span>
        <span>控制主角上下切換走道</span>
      </div>
      <div class="rules-guide">
        <span class="rule-item">🌸 +1 分</span>
        <span class="rule-item">💩 -1 分</span>
        <span class="rule-item">🌳 / 📦 遊戲結束</span>
      </div>
    </footer>
  </div>

  <script src="game.js?v=4"></script>
</body>
</html>
