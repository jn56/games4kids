<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>兔兔跳上天 · 遊戲小花園</title>
    <!-- Google Fonts -->
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-glow: rgba(139, 92, 246, 0.3);
            --neon-purple: #a855f7;
            --neon-cyan: #06b6d4;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-light);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none; /* 停用整個網頁的手勢與滾動 */
        }

        /* Ambient glowing backgrounds */
        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .game-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 40px var(--border-glow);
            width: 100%;
            max-width: 440px;
            max-height: 96vh;
            max-height: 96dvh;
        }

        .header-row {
            flex-shrink: 0;
        }

        h1 {
            font-weight: 800;
            font-size: 2.2rem;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .game-canvas-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8),
                0 0 15px rgba(6, 182, 212, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        canvas {
            display: block;
            background-color: #0b0f19;
            width: 100%;
            height: 100%;
            aspect-ratio: 400 / 600;
            object-fit: contain;
            touch-action: none; /* 停用 Canvas 上的瀏覽器滾動與縮放 */
        }

        .instructions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
            text-align: center;
            flex-shrink: 0;
        }

        .key-badge {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            color: var(--text-light);
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-family: monospace;
        }
        #muteBtn:hover {
            background: rgba(255, 255, 255, 0.18) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
        }
        #muteBtn:active {
            transform: scale(0.95);
        }

        @media (max-width: 480px) {
            .game-container {
                padding: 15px;
                gap: 12px;
                margin-bottom: 6vh; /* 讓整體畫面稍微向上平移 */
            }
            .header-row {
                flex-wrap: wrap;
                justify-content: center !important;
                gap: 10px;
            }
            .header-row h1 {
                width: 100%;
                text-align: center;
                order: -1;
                font-size: 1.5rem !important;
            }
            .instructions {
                font-size: 0.75rem;
                gap: 4px;
            }
        }
    </style>
<meta name="description" content="左右移動、抓準時機跳上移動階梯，一階一階挑戰更高的天空！">
<link rel="stylesheet" href="../shared/game.css">
</head>

<body class="game-page game-portrait" data-game="stair_jump">
    <div class="ambient-glow"></div>

    <div class="game-container">
        <div class="header-row" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 400px; margin-bottom: 5px;">
            <a href="../index.html" style="text-decoration: none; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #f8fafc; padding: 6px 14px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.85rem; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s;">🏠 返回</a>
            <h1>兔兔跳上天</h1>
            <button id="muteBtn" style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #f8fafc; padding: 6px 14px; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.85rem; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; outline: none;">🔊 聲音: 開</button>
        </div>
        <div class="game-canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
        </div>
        <div class="instructions">
            <div>左右移動: <span class="key-badge">←</span>/<span class="key-badge">→</span> 或 <span class="key-badge">A</span>/<span class="key-badge">D</span> <span style="opacity: 0.7;">(觸控: 按住左右兩側)</span></div>
            <div>跳躍: <span class="key-badge">↑</span> 或 <span class="key-badge">Space</span> <span style="opacity: 0.7;">(觸控: 點擊上方或向上滑動)</span></div>
        </div>
    </div>

    <script src="../shared/catalog.js"></script>
<script src="../shared/audio.js"></script>
<script src="../shared/shell.js"></script>
<script src="config.js"></script>
    <script src="game.js"></script>
</body>

</html>
